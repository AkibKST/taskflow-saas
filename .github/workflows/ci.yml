name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Dummy values so steps that load config/env or the Prisma config don't fail.
# None of these connect to a database (generate/typecheck/build are offline).
env:
  NODE_ENV: test
  PORT: "5000"
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  JWT_SECRET: ci-secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_SECRET: ci-refresh-secret
  JWT_REFRESH_EXPIRES_IN: 7d
  CLIENT_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
  NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

jobs:
  build-and-test:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Install the whole workspace from the ROOT lockfile — the same way the
      # app actually resolves @taskflow/shared — instead of each package's own
      # lockfile, so CI matches the real build environment.
      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace server

      - name: Server typecheck
        run: npm run typecheck --workspace server

      - name: Server unit tests
        run: npm run test --workspace server

      - name: Client typecheck
        run: npx tsc --noEmit
        working-directory: client

      - name: Client lint
        run: npx next lint
        working-directory: client

      # Full production build — catches Next.js SSG/tsc-emit breakage that a
      # typecheck alone would miss.
      - name: Production build (server + client)
        run: |
          npm run build --workspace server
          npm run build --workspace client
