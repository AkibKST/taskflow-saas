name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Dummy values so steps that load config/env or the Prisma config don't fail.
# None of these connect to a database (generate/typecheck/build are offline).
env:
  NODE_ENV: test
  PORT: "5000"
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  JWT_SECRET: ci-secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_SECRET: ci-refresh-secret
  JWT_REFRESH_EXPIRES_IN: 7d
  CLIENT_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
  NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

jobs:
  build-and-test:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest

    # Real Postgres for the integration suite. The app connects via the
    # node-postgres driver here (DATABASE_DRIVER auto-selects "pg" for
    # localhost URLs); production keeps the Neon serverless driver.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Install the whole workspace from the ROOT lockfile — the same way the
      # app actually resolves @taskflow/shared — instead of each package's own
      # lockfile, so CI matches the real build environment.
      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace server

      - name: Server typecheck
        run: npm run typecheck --workspace server

      - name: Server unit tests
        run: npm run test --workspace server

      # Full HTTP-level suite against the real database: auth flows, tenant
      # isolation, RBAC, invite lifecycle, health/hardening. Applies the
      # committed migrations first, so it also proves a fresh deploy works.
      - name: Server integration tests
        run: npm run test:integration --workspace server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test

      - name: Client typecheck
        run: npx tsc --noEmit
        working-directory: client

      - name: Client lint
        run: npx next lint
        working-directory: client

      # Component/store/hook tests: optimistic UI + rollback, socket-echo
      # de-duplication, kanban column drag/drop handlers, auth persistence.
      - name: Client unit tests
        run: npm run test --workspace client

      # Full production build — catches Next.js SSG/tsc-emit breakage that a
      # typecheck alone would miss.
      - name: Production build (server + client)
        run: |
          npm run build --workspace server
          npm run build --workspace client
